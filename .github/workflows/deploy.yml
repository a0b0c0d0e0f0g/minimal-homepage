name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]   # 你的默认分支是 master，如果是 main 就改成 main
  pull_request:
  workflow_dispatch:     # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=minimal-homepage
          # 把上面的 minimal-homepage 换成你在 Cloudflare 创建的真实项目名
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
